name: Build Safi APK v2.0 Final

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Auto-fix bugs
        run: |
          cat > pubspec.yaml <<'YAML'
          name: safi
          description: "صافي - افحص هاتفك"
          publish_to: 'none'
          version: 2.0.0+20
          environment:
            sdk: ^3.5.4
            flutter: ">=3.24.0"
          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            cupertino_icons: ^1.0.8
            google_fonts: ^6.2.1
            flutter_secure_storage: ^9.2.2
            sqflite: ^2.4.1
            path: ^1.9.0
            intl: ^0.19.0
            workmanager: ^0.5.2
            device_info_plus: ^10.1.2
            package_info_plus: ^8.0.2
            crypto: ^3.0.5
            http: ^1.2.2
            shared_preferences: ^2.3.3
            local_auth: ^2.2.0
            url_launcher: ^6.3.0
            flutter_svg: ^2.0.10+1
            path_provider: ^2.1.4
            connectivity_plus: ^6.0.3
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          YAML
          sed -i 's/java\.time\.Instant\.ofEpochMilli(\(.*\))\.toString()/Date(\1).toString()/g' android/app/src/main/kotlin/sa/safi/android/AuditChannel.kt
          sed -i 's/java\.time\.Instant\.now()\.toString()/Date().toString()/g' android/app/src/main/kotlin/sa/safi/android/AuditChannel.kt
          sed -i 's/import java\.time\.Instant/import java.util.Date/g' android/app/src/main/kotlin/sa/safi/android/AuditChannel.kt || true
          grep -q "import java.util.Date" android/app/src/main/kotlin/sa/safi/android/AuditChannel.kt || sed -i '/import java.security.KeyStore/a import java.util.Date' android/app/src/main/kotlin/sa/safi/android/AuditChannel.kt
          sed -i 's/compileSdk = 34/compileSdk = 35/g' android/app/build.gradle
          grep -q "work-runtime" android/app/build.gradle || sed -i '/defaultConfig {/a \    dependencies {\n        implementation "androidx.work:work-runtime-ktx:2.9.0"\n    }\n' android/app/build.gradle

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --debug --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: safi-apk-final
          path: build/app/outputs/flutter-apk/*.apk
